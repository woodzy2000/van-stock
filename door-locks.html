<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Door Locks - UPVC Repair Van Stock</title>

<link rel="stylesheet" href="style.css">

<style>

.door-lock-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.door-lock-info {
    flex: 1;
    min-width: 130px;
}

.door-lock-info strong {
    display: block;
    font-size: 17px;
}

.door-lock-info span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
}

.door-lock-photo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
}

.door-lock-item.low-stock {
    border: 2px solid #d00000;
}

.door-lock-item.low-stock .qty {
    color: #d00000;
    font-weight: bold;
}

.extra-delete {
    background: #d00000 !important;
    color: white !important;
}

#door-lock-photo-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0,0,0,0.95);
    align-items: center;
    justify-content: center;
}

#door-lock-large-photo {
    max-width: 95%;
    max-height: 90%;
    object-fit: contain;
    border-radius: 10px;
}

#door-lock-close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 40px;
    color: white;
    background: none;
    border: none;
}

</style>
</head>

<body>

<div class="header">
    <h1>Door Locks</h1>
    <p>UPVC Repair - Van Stock</p>
</div>

<div class="container">

<button class="menu-button" onclick="window.location='index.html'">
    ← Back
</button>

<h2>Gearbox Locks</h2>

<div id="door-lock-list"></div>

<h2>Additional Door Locks</h2>

<div id="door-lock-extra-list"></div>

<button
    class="menu-button"
    type="button"
    onclick="openDoorLockForm()">
    ＋ Add Door Lock
</button>


<!-- ADD DOOR LOCK FORM -->

<div
    id="door-lock-form"
    style="display:none;margin-top:20px;">

    <h3>Add Door Lock</h3>

    <label for="door-lock-description">
        Lock Name
    </label>

    <input
        id="door-lock-description"
        type="text"
        placeholder="Enter lock name"
        style="width:100%;box-sizing:border-box;padding:12px;margin-top:5px;">


    <label
        for="door-lock-backset"
        style="display:block;margin-top:15px;">
        Backset
    </label>

    <input
        id="door-lock-backset"
        type="text"
        placeholder="e.g. 35mm"
        style="width:100%;box-sizing:border-box;padding:12px;margin-top:5px;">


    <label
        for="door-lock-quantity"
        style="display:block;margin-top:15px;">
        Quantity
    </label>

    <input
        id="door-lock-quantity"
        type="number"
        value="0"
        min="0"
        style="width:100%;box-sizing:border-box;padding:12px;margin-top:5px;">


    <label
        style="display:block;margin-top:15px;">
        Photo
    </label>

    <input
        id="door-lock-camera"
        type="file"
        accept="image/*"
        capture="environment"
        hidden>

    <button
        class="menu-button"
        type="button"
        onclick="document.getElementById('door-lock-camera').click()">
        📷 Take Photo
    </button>


    <input
        id="door-lock-library"
        type="file"
        accept="image/*"
        hidden>

    <button
        class="menu-button"
        type="button"
        onclick="document.getElementById('door-lock-library').click()">
        🖼️ Choose Photo
    </button>


    <div
        id="door-lock-photo-preview"
        style="margin-top:15px;text-align:center;">
    </div>


    <!-- PERMANENT OPTION -->

    <label
        style="display:flex;align-items:center;gap:10px;margin-top:20px;font-size:16px;">

        <input
            id="door-lock-permanent"
            type="checkbox"
            style="width:22px;height:22px;">

        Make this lock permanent

    </label>


    <button
        class="menu-button"
        type="button"
        onclick="saveExtraDoorLock()"
        style="margin-top:20px;">
        Save Door Lock
    </button>

    <button
        class="menu-button"
        type="button"
        onclick="closeDoorLockForm()">
        Cancel
    </button>

</div>

</div>


<!-- LARGE PHOTO -->

<div
    id="door-lock-photo-modal"
    onclick="closeDoorLockPhoto()">

    <img
        id="door-lock-large-photo"
        src=""
        alt="Door lock photo">

    <button
        id="door-lock-close"
        type="button"
        onclick="closeDoorLockPhoto(event)">
        ×
    </button>

</div>


<script src="app.js"></script>

<script>

/* =========================================================
   EXISTING 17 PERMANENT LOCKS
   ========================================================= */

const doorLocks = [

    {
        id: "doorlock_1",
        name: "Era Vectis",
        backset: "35mm",
        image: "door-lock-images/image1.png"
    },

    {
        id: "doorlock_2",
        name: "Era Vectis",
        backset: "45mm",
        image: "door-lock-images/image2.png"
    },

    {
        id: "doorlock_3",
        name: "Era Vectis Hook",
        backset: "35mm",
        image: "door-lock-images/image3.png"
    },

    {
        id: "doorlock_4",
        name: "Era Vectis Hook",
        backset: "45mm",
        image: "door-lock-images/image4.png"
    },

    {
        id: "doorlock_5",
        name: "Era",
        backset: "35mm",
        image: "door-lock-images/image5.png"
    },

    {
        id: "doorlock_6",
        name: "Era",
        backset: "45mm",
        image: "door-lock-images/image6.png"
    },

    {
        id: "doorlock_7",
        name: "Era Hook",
        backset: "35mm",
        image: "door-lock-images/image7.png"
    },

    {
        id: "doorlock_8",
        name: "Era Hook",
        backset: "45mm",
        image: "door-lock-images/image8.png"
    },

    {
        id: "doorlock_9",
        name: "Lockmaster Gearbox Lift Lever",
        backset: "35mm",
        image: "door-lock-images/image9.png"
    },

    {
        id: "doorlock_10",
        name: "Safeware",
        backset: "35mm",
        image: "door-lock-images/image10.png"
    },

    {
        id: "doorlock_11",
        name: "Fullex XL",
        backset: "35mm",
        image: "door-lock-images/image11.png"
    },

    {
        id: "doorlock_12",
        name: "Fullex XL",
        backset: "35mm",
        image: "door-lock-images/image12.png"
    },

    {
        id: "doorlock_13",
        name: "Mila",
        backset: "35mm",
        image: "door-lock-images/image13.png"
    },

    {
        id: "doorlock_14",
        name: "G2000",
        backset: "35mm",
        image: "door-lock-images/image14.png"
    },

    {
        id: "doorlock_15",
        name: "Cego",
        backset: "35mm",
        image: "door-lock-images/image15.png"
    },

    {
        id: "doorlock_16",
        name: "Millenco Mantis 3",
        backset: "35mm",
        image: "door-lock-images/image16.png"
    },

    {
        id: "doorlock_17",
        name: "Lockmaster Hookbolt",
        backset: "35mm",
        image: "door-lock-images/image17.png"
    }

];


/* =========================================================
   STANDARD LOCKS
   ========================================================= */

function displayDoorLocks() {

    const area =
        document.getElementById("door-lock-list");

    area.innerHTML = "";

    doorLocks.forEach(lock => {

        const item =
            document.createElement("div");

        item.className =
            "stock-item door-lock-item";


        const info =
            document.createElement("div");

        info.className =
            "door-lock-info";


        const name =
            document.createElement("strong");

        name.innerText =
            lock.name;


        const backset =
            document.createElement("span");

        backset.innerText =
            "Backset: " + lock.backset;


        info.appendChild(name);
        info.appendChild(backset);


        const photo =
            document.createElement("img");

        photo.className =
            "door-lock-photo";

        photo.src =
            lock.image;

        photo.alt =
            lock.name;

        photo.onclick =
            () => showDoorLockPhoto(lock.image);


        const minus =
            document.createElement("button");

        minus.innerText = "-";

        minus.onclick =
            () => changeDoorLockQty(lock.id,-1);


        const qty =
            document.createElement("span");

        qty.className = "qty";

        qty.id = lock.id;

        qty.innerText =
            getDoorLockQty(lock.id);


        const plus =
            document.createElement("button");

        plus.innerText = "+";

        plus.onclick =
            () => changeDoorLockQty(lock.id,1);


        item.appendChild(info);
        item.appendChild(photo);
        item.appendChild(minus);
        item.appendChild(qty);
        item.appendChild(plus);

        area.appendChild(item);

        updateDoorLockLowStock(lock.id);

    });

}


/* =========================================================
   STANDARD QUANTITY
   ========================================================= */

function getDoorLockQty(id) {

    const saved =
        localStorage.getItem("stock_" + id);

    if (saved === null)
        return 0;

    return Math.max(
        0,
        parseInt(saved,10) || 0
    );
}


function changeDoorLockQty(id,amount) {

    const qty =
        document.getElementById(id);

    if (!qty) return;

    let value =
        parseInt(qty.innerText,10) || 0;

    value =
        Math.max(0,value + amount);

    qty.innerText =
        value;

    localStorage.setItem(
        "stock_" + id,
        value
    );

    updateDoorLockLowStock(id);
}


/* =========================================================
   RED AT ZERO
   ========================================================= */

function updateDoorLockLowStock(id) {

    const qty =
        document.getElementById(id);

    if (!qty) return;

    const item =
        qty.closest(".door-lock-item");

    if (!item) return;

    const value =
        parseInt(qty.innerText,10) || 0;

    item.classList.toggle(
        "low-stock",
        value === 0
    );

}


/* =========================================================
   ADD FORM
   ========================================================= */

let selectedDoorLockPhoto = "";


function openDoorLockForm() {

    document.getElementById(
        "door-lock-form"
    ).style.display = "block";

}


function closeDoorLockForm() {

    document.getElementById(
        "door-lock-form"
    ).style.display = "none";

    selectedDoorLockPhoto = "";

    document.getElementById(
        "door-lock-photo-preview"
    ).innerHTML = "";

    document.getElementById(
        "door-lock-description"
    ).value = "";

    document.getElementById(
        "door-lock-backset"
    ).value = "";

    document.getElementById(
        "door-lock-quantity"
    ).value = "0";

    document.getElementById(
        "door-lock-permanent"
    ).checked = false;

}


/* =========================================================
   PHOTO
   ========================================================= */

function handleDoorLockPhoto(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload =
        function(e) {

            const image =
                new Image();

            image.onload =
                function() {

                    const maxSize = 600;

                    const scale =
                        Math.min(
                            1,
                            maxSize /
                            Math.max(
                                image.width,
                                image.height
                            )
                        );

                    const canvas =
                        document.createElement("canvas");

                    canvas.width =
                        Math.max(
                            1,
                            image.width * scale
                        );

                    canvas.height =
                        Math.max(
                            1,
                            image.height * scale
                        );

                    canvas
                        .getContext("2d")
                        .drawImage(
                            image,
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );

                    selectedDoorLockPhoto =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.5
                        );


                    document.getElementById(
                        "door-lock-photo-preview"
                    ).innerHTML =

                        '<img src="' +
                        selectedDoorLockPhoto +
                        '" style="width:100px;height:100px;object-fit:contain;border-radius:8px;cursor:pointer" onclick="showDoorLockPhoto(selectedDoorLockPhoto)">' +

                        "<p>Tap photo to view large</p>";

                };

            image.src =
                e.target.result;

        };

    reader.readAsDataURL(file);

}


document.getElementById(
    "door-lock-camera"
).addEventListener(
    "change",
    handleDoorLockPhoto
);


document.getElementById(
    "door-lock-library"
).addEventListener(
    "change",
    handleDoorLockPhoto
);


/* =========================================================
   EXTRA LOCKS
   ========================================================= */

function getExtraDoorLocks() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "door-locks_extras"
            ) || "[]"
        );

    } catch(e) {

        return [];

    }

}


function saveExtraDoorLock() {

    const name =
        document.getElementById(
            "door-lock-description"
        ).value.trim();


    const backset =
        document.getElementById(
            "door-lock-backset"
        ).value.trim();


    const quantity =
        Math.max(
            0,
            parseInt(
                document.getElementById(
                    "door-lock-quantity"
                ).value,
                10
            ) || 0
        );


    const permanent =
        document.getElementById(
            "door-lock-permanent"
        ).checked;


    if (!name) {

        alert("Please enter the lock name.");

        return;

    }


    if (!backset) {

        alert("Please enter the backset.");

        return;

    }


    if (!selectedDoorLockPhoto) {

        alert("Please add a photo.");

        return;

    }


    const extras =
        getExtraDoorLocks();


    extras.push({

        id:
            "door-locks_" +
            Date.now(),

        description:
            name,

        backset:
            backset,

        quantity:
            quantity,

        photo:
            selectedDoorLockPhoto,

        permanent:
            permanent

    });


    try {

        localStorage.setItem(
            "door-locks_extras",
            JSON.stringify(extras)
        );

    } catch(e) {

        alert(
            "The photo is too large to save. Please try another photo."
        );

        return;

    }


    closeDoorLockForm();

    displayExtraDoorLocks();

}


/* =========================================================
   DISPLAY EXTRA LOCKS
   ========================================================= */

function displayExtraDoorLocks() {

    const area =
        document.getElementById(
            "door-lock-extra-list"
        );

    area.innerHTML = "";


    getExtraDoorLocks().forEach(lock => {

        const item =
            document.createElement("div");

        item.className =
            "stock-item door-lock-item";


        if (
            (parseInt(lock.quantity,10) || 0)
            === 0
        ) {

            item.classList.add(
                "low-stock"
            );

        }


        const info =
            document.createElement("div");

        info.className =
            "door-lock-info";


        const name =
            document.createElement("strong");

        name.innerText =
            lock.description;


        const backset =
            document.createElement("span");

        backset.innerText =
            "Backset: " +
            lock.backset;


        info.appendChild(name);
        info.appendChild(backset);


        const photo =
            document.createElement("img");

        photo.className =
            "door-lock-photo";

        photo.src =
            lock.photo;

        photo.alt =
            lock.description;

        photo.onclick =
            () => showDoorLockPhoto(lock.photo);


        const minus =
            document.createElement("button");

        minus.innerText =
            "-";

        minus.onclick =
            () => changeExtraDoorLockQty(
                lock.id,
                -1
            );


        const qty =
            document.createElement("span");

        qty.className =
            "qty";

        qty.innerText =
            lock.quantity;


        const plus =
            document.createElement("button");

        plus.innerText =
            "+";

        plus.onclick =
            () => changeExtraDoorLockQty(
                lock.id,
                1
            );


        item.appendChild(info);

        item.appendChild(photo);

        item.appendChild(minus);

        item.appendChild(qty);

        item.appendChild(plus);


        /*
           ONLY NON-PERMANENT LOCKS
           GET A DELETE BUTTON
        */

        if (!lock.permanent) {

            const del =
                document.createElement("button");

            del.innerText =
                "×";

            del.className =
                "extra-delete";

            del.onclick =
                () => deleteExtraDoorLock(
                    lock.id
                );

            item.appendChild(del);

        }


        area.appendChild(item);

    });

}


/* =========================================================
   CHANGE EXTRA QUANTITY
   ========================================================= */

function changeExtraDoorLockQty(
    id,
    amount
) {

    const extras =
        getExtraDoorLocks();

    const lock =
        extras.find(
            x => x.id === id
        );

    if (!lock) return;


    lock.quantity =
        Math.max(
            0,
            (parseInt(
                lock.quantity,
                10
            ) || 0) + amount
        );


    localStorage.setItem(
        "door-locks_extras",
        JSON.stringify(extras)
    );


    displayExtraDoorLocks();

}


/* =========================================================
   DELETE NON-PERMANENT LOCK
   ========================================================= */

function deleteExtraDoorLock(id) {

    const extras =
        getExtraDoorLocks();

    const lock =
        extras.find(
            x => x.id === id
        );

    if (!lock) return;


    if (lock.permanent) {

        alert(
            "This lock is permanent and cannot be deleted."
        );

        return;

    }


    if (
        !confirm(
            "Remove this door lock?"
        )
    ) {

        return;

    }


    localStorage.setItem(
        "door-locks_extras",
        JSON.stringify(
            extras.filter(
                x => x.id !== id
            )
        )
    );


    displayExtraDoorLocks();

}


/* =========================================================
   PHOTO VIEWER
   ========================================================= */

function showDoorLockPhoto(photo) {

    if (!photo) return;


    document.getElementById(
        "door-lock-large-photo"
    ).src = photo;


    document.getElementById(
        "door-lock-photo-modal"
    ).style.display = "flex";

}


function closeDoorLockPhoto(event) {

    if (event)
        event.stopPropagation();


    document.getElementById(
        "door-lock-photo-modal"
    ).style.display = "none";


    document.getElementById(
        "door-lock-large-photo"
    ).src = "";

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        displayDoorLocks();

        displayExtraDoorLocks();

    }
);

</script>

</body>
</html>
