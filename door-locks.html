<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Door Locks - UPVC Repair Van Stock</title><link rel="stylesheet" href="style.css">
<style>
.door-lock-item{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}.door-lock-info,.extra-door-lock-info{display:flex;flex-direction:column;flex:1;min-width:120px}.door-lock-info strong,.extra-door-lock-info strong{font-size:18px}.door-lock-info span,.extra-door-lock-info span{margin-top:4px;font-size:14px}.door-lock-photo{width:90px;height:90px;object-fit:contain;border-radius:8px;background:#fff;cursor:pointer;flex-shrink:0}.door-lock-item.low-stock{border:2px solid #d00000}.door-lock-item.low-stock .qty{color:#d00000}#door-lock-photo-modal{display:none;position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,.95);align-items:center;justify-content:center}#door-lock-large-photo{max-width:95%;max-height:90%;object-fit:contain;border-radius:10px}
</style>
</head>
<body>
<div class="header"><h1>Door Locks</h1><p>UPVC Repair - Van Stock</p></div>
<div class="container"><button class="menu-button" onclick="window.location='index.html'">← Back</button><h2>Gearbox Locks</h2>
<div id="standard-locks"></div><h2>Additional Door Locks</h2><div id="door-locks-extras"></div>
<button class="menu-button" type="button" onclick="openDoorLockForm()">＋ Add Extra Door Lock</button>
<div id="door-lock-form" style="display:none;margin-top:20px"><h3>Add Extra Door Lock</h3><label for="door-lock-description">Name</label><input id="door-lock-description" type="text" placeholder="Enter lock name" style="width:100%;box-sizing:border-box;padding:12px;margin-top:5px"><label for="door-lock-backset" style="display:block;margin-top:15px">Backset</label><input id="door-lock-backset" type="text" placeholder="e.g. 35mm" style="width:100%;box-sizing:border-box;padding:12px;margin-top:5px"><label for="door-lock-quantity" style="display:block;margin-top:15px">Quantity</label><input id="door-lock-quantity" type="number" value="0" min="0" style="width:100%;box-sizing:border-box;padding:12px;margin-top:5px"><label style="display:block;margin-top:15px">Photo</label><input id="door-lock-camera" type="file" accept="image/*" capture="environment" hidden><button class="menu-button" type="button" onclick="document.getElementById('door-lock-camera').click()">📷 Take Photo</button><input id="door-lock-library" type="file" accept="image/*" hidden><button class="menu-button" type="button" onclick="document.getElementById('door-lock-library').click()">🖼️ Choose Photo</button><div id="door-lock-photo-preview" style="margin-top:15px;text-align:center"></div><button class="menu-button" type="button" onclick="saveExtraDoorLock()" style="margin-top:20px">Save Door Lock</button><button class="menu-button" type="button" onclick="closeDoorLockForm()">Cancel</button></div></div>
<div id="door-lock-photo-modal" onclick="closeDoorLockPhoto()"><img id="door-lock-large-photo" alt="Door lock photo"><button type="button" onclick="closeDoorLockPhoto(event)" style="position:absolute;top:20px;right:20px;font-size:30px;background:none;border:none;color:white">×</button></div>
<script src="app.js"></script><script>
let selectedDoorLockPhoto='';const doorLockNames={doorlock_1:'Era Vectis 35mm',doorlock_2:'Era Vectis 45mm',doorlock_3:'Era Vectis Hook 35mm',doorlock_4:'Era Vectis Hook 45mm',doorlock_5:'Era 35mm',doorlock_6:'Era 45mm'};
function updateDoorLockLowStock(id){const q=document.getElementById(id),i=q&&q.closest('.door-lock-item');if(i)i.classList.toggle('low-stock',(parseInt(q.innerText,10)||0)===0)}
function changeDoorLockQty(id,n){const q=document.getElementById(id);if(!q)return;const v=Math.max(0,(parseInt(q.innerText,10)||0)+n);q.innerText=v;localStorage.setItem('stock_'+id,v);localStorage.setItem('stock_name_'+id,doorLockNames[id]);updateDoorLockLowStock(id)}
function loadDoorLockStock(){Object.entries(doorLockNames).forEach(([id,name])=>{const q=document.getElementById(id),v=localStorage.getItem('stock_'+id);if(q){if(v!==null)q.innerText=v;updateDoorLockLowStock(id)}localStorage.setItem('stock_name_'+id,name)})}
function showDoorLockPhoto(src){if(!src)return;document.getElementById('door-lock-large-photo').src=src;document.getElementById('door-lock-photo-modal').style.display='flex'}function closeDoorLockPhoto(e){if(e)e.stopPropagation();document.getElementById('door-lock-photo-modal').style.display='none';document.getElementById('door-lock-large-photo').src=''}
function openDoorLockForm(){document.getElementById('door-lock-form').style.display='block'}function closeDoorLockForm(){document.getElementById('door-lock-form').style.display='none';selectedDoorLockPhoto='';document.getElementById('door-lock-photo-preview').innerHTML='';document.getElementById('door-lock-camera').value='';document.getElementById('door-lock-library').value=''}
function handleDoorLockPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*s);c.height=Math.max(1,im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);selectedDoorLockPhoto=c.toDataURL('image/jpeg',.5);document.getElementById('door-lock-photo-preview').innerHTML='<img src="'+selectedDoorLockPhoto+'" style="width:100px;height:100px;object-fit:contain;cursor:pointer" onclick="showDoorLockPhoto(selectedDoorLockPhoto)"><p>Tap photo to view large</p>'};im.src=x.target.result};r.readAsDataURL(f)}
function getDoorLockExtras(){try{return JSON.parse(localStorage.getItem('door-locks_extras')||'[]')}catch(e){return[]}}function saveExtraDoorLock(){const d=document.getElementById('door-lock-description').value.trim(),b=document.getElementById('door-lock-backset').value.trim(),q=parseInt(document.getElementById('door-lock-quantity').value,10)||0;if(!d)return alert('Please enter a lock name.');if(!b)return alert('Please enter the backset.');const a=getDoorLockExtras();a.push({id:'door-locks_'+Date.now(),description:d,backset:b,quantity:q,photo:selectedDoorLockPhoto});try{localStorage.setItem('door-locks_extras',JSON.stringify(a))}catch(e){return alert('The photo is too large to save. Please try another photo.')}document.getElementById('door-lock-description').value='';document.getElementById('door-lock-backset').value='';document.getElementById('door-lock-quantity').value=0;closeDoorLockForm();displayDoorLockExtras()}
function changeDoorLockExtraQty(id,n){const a=getDoorLockExtras(),x=a.find(v=>v.id===id);if(!x)return;x.quantity=Math.max(0,(parseInt(x.quantity,10)||0)+n);localStorage.setItem('door-locks_extras',JSON.stringify(a));displayDoorLockExtras()}
function displayDoorLockExtras(){const area=document.getElementById('door-locks-extras');area.innerHTML='';getDoorLockExtras().forEach(x=>{const i=document.createElement('div');i.className='stock-item door-lock-item'+((+x.quantity||0)===0?' low-stock':'');if(x.photo){const p=document.createElement('img');p.className='door-lock-photo';p.src=x.photo;p.alt=x.description;p.onclick=()=>showDoorLockPhoto(x.photo);i.appendChild(p)}const info=document.createElement('div');info.className='extra-door-lock-info';info.innerHTML='<strong>'+x.description+'</strong><span>Backset: '+x.backset+'</span>';i.appendChild(info);[-1,1].forEach(n=>{const b=document.createElement('button');b.innerText=n<0?'-':'+';b.onclick=()=>changeDoorLockExtraQty(x.id,n);i.appendChild(b);if(n<0){const q=document.createElement('span');q.className='qty';q.innerText=x.quantity;i.appendChild(q)}});area.appendChild(i)})}
document.getElementById('door-lock-camera').addEventListener('change',handleDoorLockPhoto);document.getElementById('door-lock-library').addEventListener('change',handleDoorLockPhoto);
document.addEventListener('DOMContentLoaded',()=>{const area=document.getElementById('standard-locks');Object.entries(doorLockNames).forEach(([id,name],n)=>{const i=document.createElement('div');i.className='stock-item door-lock-item';i.id='item-'+id;i.innerHTML='<div class="door-lock-info"><strong>'+name.replace(/ 35mm| 45mm/,'')+'</strong><span>Backset: '+(name.includes('45mm')?'45mm':'35mm')+'</span></div><img class="door-lock-photo" src="image'+(n+1)+'.png" alt="'+name+'" onclick="showDoorLockPhoto(this.src)"><button onclick="changeDoorLockQty(\''+id+'\',-1)">-</button><span class="qty" id="'+id+'">0</span><button onclick="changeDoorLockQty(\''+id+'\',1)">+</button>';area.appendChild(i)});loadDoorLockStock();displayDoorLockExtras()});
</script></body></html>
