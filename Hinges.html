    <div class="stock-item">

        <span class="qty" id="hinge17_10">0</span>
        <button onclick="changeQty('hinge17_10', 1)">+</button>
    </div>

    <div class="stock-item">
        <span>12"</span>
        <button onclick="changeQty('hinge17_12', -1)">-</button>
        <span class="qty" id="hinge17_12">0</span>
        <button onclick="changeQty('hinge17_12', 1)">+</button>
    </div>

    <div class="stock-item">

    </div>

    <div class="stock-item">

        <button onclick="changeQty('hinge17_20', 1)">+</button>

    <!-- ADDITIONAL HINGES -->

    <h2>Additional Hinges</h2>

    <div id="hinges-extras"></div>

    <button
        class="menu-button"
        type="button"
        onclick="openHingeForm()">
        ＋ Add Extra Hinge
    </button>


    <!-- ADD HINGE FORM -->

    <div id="hinge-form" style="display:none; margin-top:20px;">

        <h3>Add Extra Hinge</h3>

        <label>Product name</label>

        <input
            type="text"
            id="hinge-description"
            placeholder="Enter hinge name"
            style="width:100%; box-sizing:border-box; padding:12px; margin-top:5px;"
        >

        <label style="display:block; margin-top:15px;">
            Quantity
        </label>

        <input
            type="number"
            id="hinge-quantity"
            value="1"
            min="0"
            style="width:100%; box-sizing:border-box; padding:12px; margin-top:5px;"
        >


        <!-- CAMERA -->

        <label style="display:block; margin-top:15px;">
            Photo
        </label>

        <input
            type="file"
            id="hinge-camera"
            accept="image/*"
            capture="environment"
            style="display:none;"
        >

        <button
            class="menu-button"
            type="button"
            onclick="document.getElementById('hinge-camera').click()">
            📷 Take Photo
        </button>


        <!-- PHOTO LIBRARY -->

        <input
            type="file"
            id="hinge-library"
            accept="image/*"
            style="display:none;"
        >

        <button
            class="menu-button"
            type="button"
            onclick="document.getElementById('hinge-library').click()">
            🖼️ Choose Photo
        </button>


        <!-- PHOTO PREVIEW -->

        <div
            id="hinge-photo-preview"
            style="margin-top:15px; text-align:center;">
        </div>


        <button
            class="menu-button"
            type="button"
            onclick="saveExtraHinge()"
            style="margin-top:20px;">
            Save Hinge
        </button>

        <button
            class="menu-button"
            type="button"
            onclick="closeHingeForm()">
            Cancel
        </button>

    </div>

</div>


<!-- LARGE PHOTO VIEW -->

<div
    id="hinge-photo-modal"
    onclick="closeHingePhoto()"
    style="
        display:none;
        position:fixed;
        z-index:9999;
        left:0;
        top:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.95);
        align-items:center;
        justify-content:center;
    "
>

    <img
        id="hinge-large-photo"
        src=""
        alt="Hinge photo"
        style="
            max-width:95%;
            max-height:90%;
            object-fit:contain;
            border-radius:10px;
        "
    >

    <button
        type="button"
        onclick="closeHingePhoto(event)"
        style="
            position:absolute;
            top:20px;
            right:20px;
            font-size:30px;
            background:none;
            border:none;
            color:white;
        ">
        ×
    </button>

</div>


<script src="app.js"></script>


<script>

let selectedHingePhoto = "";


function openHingeForm() {

    document.getElementById(
        "hinge-form"
    ).style.display = "block";

}


function closeHingeForm() {

    document.getElementById(
        "hinge-form"
    ).style.display = "none";

    selectedHingePhoto = "";

    document.getElementById(
        "hinge-photo-preview"
    ).innerHTML = "";

    document.getElementById(
        "hinge-camera"
    ).value = "";

    document.getElementById(
        "hinge-library"
    ).value = "";
}


/* =========================
   HANDLE CAMERA
========================= */

document.getElementById(
    "hinge-camera"
).addEventListener(
    "change",
    handleHingePhoto
);


/* =========================
   HANDLE PHOTO LIBRARY
========================= */

document.getElementById(
    "hinge-library"
).addEventListener(
    "change",
    handleHingePhoto
);


/* =========================
   READ PHOTO
========================= */

function handleHingePhoto(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e) {

        selectedHingePhoto =
            e.target.result;

        document.getElementById(
            "hinge-photo-preview"
        ).innerHTML = `
            <img
                src="${selectedHingePhoto}"
                onclick="showHingePhoto('${selectedHingePhoto}')"
                style="
                    width:100px;
                    height:100px;
                    object-fit:cover;
                    border-radius:10px;
                    cursor:pointer;
                "
            >
            <p>Tap photo to view large</p>
        `;

    };

    reader.readAsDataURL(file);
}


/* =========================
   SAVE HINGE
========================= */

function saveExtraHinge() {

    const description =
        document.getElementById(
            "hinge-description"
        ).value.trim();

    const quantity =
        parseInt(
            document.getElementById(
                "hinge-quantity"
            ).value,
            10
        ) || 0;


    if (!description) {

        alert(
            "Please enter a product name."
        );

        return;
    }


    saveHingeWithPhoto(
        description,
        quantity,
        selectedHingePhoto
    );


    document.getElementById(
        "hinge-description"
    ).value = "";

    document.getElementById(
        "hinge-quantity"
    ).value = "1";


    closeHingeForm();
}


/* =========================
   SHOW LARGE PHOTO
========================= */

function showHingePhoto(photo) {

    document.getElementById(
        "hinge-large-photo"
    ).src = photo;

    document.getElementById(
        "hinge-photo-modal"
    ).style.display = "flex";
}


/* =========================
   CLOSE LARGE PHOTO
========================= */

function closeHingePhoto(event) {

    if (event) {
        event.stopPropagation();
    }

    document.getElementById(
        "hinge-photo-modal"
    ).style.display = "none";

    document.getElementById(
        "hinge-large-photo"
    ).src = "";
}

</script>

</body>
</html>
